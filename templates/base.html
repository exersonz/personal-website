<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cinty Lin{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sen:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='journal.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="light-mode">    
    <header>
        <div class="container">
            <nav>
                <a href="/" class="logo-link">
                    <div class="logo">
                        <span class="logo-text">Cinty Lin</span>
                    </div>
                </a>
                <ul class="nav-links" aria-label="Main navigation">
                    <li><a href="{{ url_for('index') }}" class="{% if request.path == '/' %}active{% endif %}">Home</a></li>
                    <li><a href="{{ url_for('research') }}" class="{% if request.path == '/research' %}active{% endif %}">My Work</a></li>
                    <li><a href="{{ url_for('volunteering') }}" class="{% if request.path == '/volunteering' %}active{% endif %}">Community</a></li>
                    <li><a href="{{ url_for('hobbies') }}" class="{% if request.path.startswith('/hobbies') %}active{% endif %}">Little Joys</a></li>
                    <li><a href="{{ url_for('resume') }}" class="{% if request.path == '/resume' %}active{% endif %}">Resume</a></li>
                </ul>
                <div class="header-controls">
                    <form action="{{ url_for('logout') }}" method="post" class="logout-form">
                        <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                        <button type="submit" class="logout-btn">Logout</button>
                    </form>
                </div>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-left">
                <p>&copy; {{ current_year }} Cinty Lin. All rights reserved.</p>
            </div>
            <div class="footer-right">
                <a href="https://www.instagram.com/croisssssantiiiii/" target="_blank" aria-label="Instagram"><i class="fa-brands fa-square-instagram"></i></a>
                <a href="mailto:cinty.lin.cinty@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </footer>
    
    <script>
        // Redirect at the fixed server-issued expiration time.
        const sessionExpiration = {{ session_expiration_ms | tojson }};
        if (sessionExpiration) {
            const redirectOnExpiry = () => {
                if (Date.now() >= sessionExpiration) window.location.replace({{ url_for('login') | tojson }});
            };
            window.setTimeout(redirectOnExpiry, Math.max(0, sessionExpiration - Date.now()));
            document.addEventListener('visibilitychange', redirectOnExpiry);
            window.addEventListener('pageshow', redirectOnExpiry);
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
